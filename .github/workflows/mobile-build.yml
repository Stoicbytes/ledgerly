name: Phone app build (EAS)

# Builds the Android and/or iPhone app on Expo's servers. Runs only by hand (Actions →
# "Phone app build" → Run workflow). Needs the repository secret EXPO_TOKEN (an Expo access
# token, expo.dev → Account settings → Access tokens); without it the job only prints how to
# set it up. The app's EXPO_PUBLIC_* values come from the EAS project's environment variables,
# not from GitHub. See docs/features/MOBILE.md.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: preview (install directly) or production (for the stores)
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  build:
    name: EAS build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/command-center
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check the Expo token
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not set; add it as a repository secret to build the phone app."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/command-center/package-lock.json
      - name: Install
        if: steps.token.outputs.ready == 'true'
        run: npm ci
      - name: Start the build on Expo's servers
        if: steps.token.outputs.ready == 'true'
        run: >
          npx --yes eas-cli@24.8.0 build
          --platform "${{ inputs.platform }}"
          --profile "${{ inputs.profile }}"
          --non-interactive --no-wait
